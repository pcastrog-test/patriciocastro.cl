<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F5F7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>La Cadena del Helado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #F4F5F7; --tarjeta: #FFFFFF; --tinta: #111827; --suave: #6B7280; --tenue: #9CA3AF; --linea: #E5E7EB;
    --acento: #4F6BED; --acento-suave: #EEF1FE; --alerta: #DC2626; --ok: #16A34A; --rol: #111827;
    --sombra: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fondo); color: var(--tinta);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%;
    touch-action: manipulation; font-feature-settings: "tnum" 1, "cv11" 1;
  }
  main { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 0 14px calc(14px + env(safe-area-inset-bottom)); }

  .barra { display: flex; justify-content: space-between; align-items: center; padding: 14px 2px 12px; }
  .marca { font-size: 11.5px; font-weight: 800; letter-spacing: .32em; color: var(--acento); text-transform: uppercase; }
  .marca i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--acento); margin-right: 8px; vertical-align: 1px; }
  .etiqueta { font-size: 12px; font-weight: 600; color: var(--suave); background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 99px; padding: 3px 10px; }

  h1 { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 4px 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 16px; font-weight: 700; margin: 20px 0 8px; }
  p { margin: 6px 0; }
  .suave { color: var(--suave); }
  .chico { font-size: 13px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .filtro { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--suave); }
  .filtro b { color: var(--tinta); font-weight: 600; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .btn { display: block; width: 100%; padding: 14px 16px; font-size: 16px; font-weight: 600; background: var(--acento); color: #fff; margin-top: 10px; box-shadow: var(--sombra); }
  .btn.rol { background: var(--rol); }
  .btn.claro { background: var(--tarjeta); color: var(--tinta); border: 1px solid var(--linea); }
  .btn:disabled { opacity: .4; box-shadow: none; }
  .empuja { flex: 1; min-height: 8px; }

  .tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; padding: 14px; margin-top: 10px; box-shadow: var(--sombra); }
  .tarjeta-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tarjeta-cab b { font-size: 14px; font-weight: 600; }
  .pildora { font-size: 11.5px; font-weight: 600; color: var(--acento); background: var(--acento-suave); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
  ul.reglas { padding: 0; margin: 0; list-style: none; }
  ul.reglas li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linea); font-size: 14.5px; }
  ul.reglas li:last-child { border-bottom: 0; }
  ul.reglas li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 2px; background: var(--acento); margin-top: 8px; }

  .cadenas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .cadenas button { padding: 13px 0; font-size: 19px; font-weight: 700; background: var(--fondo); border: 1px solid var(--linea); }
  .cadenas button.sel { background: var(--acento); color: #fff; border-color: var(--acento); }

  .traspaso { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; background: var(--rol); color: #fff; border-radius: 16px; padding: 24px 18px; margin-top: 2px; box-shadow: var(--sombra); }
  .traspaso .semana { align-self: center; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.16); border-radius: 99px; padding: 4px 12px; }
  .traspaso .pasa { font-size: 17px; margin-top: 22px; opacity: .9; }
  .traspaso .quien { font-size: 42px; font-weight: 800; line-height: 1.05; margin: 6px 0 4px; letter-spacing: -.02em; }
  .traspaso .sub { font-size: 14.5px; opacity: .85; }
  .traspaso .aviso { margin-top: 18px; font-size: 14px; background: rgba(255,255,255,.16); border-radius: 10px; padding: 8px 10px; }
  .traspaso .btn { background: #fff; color: var(--rol); margin-top: 26px; }

  .cabecera { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px 0; box-shadow: var(--sombra); }
  .cabecera .fila { display: flex; justify-content: space-between; align-items: center; }
  .cabecera b { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .cabecera b i { width: 12px; height: 12px; border-radius: 4px; background: var(--rol); }
  .cabecera span { font-size: 12.5px; color: var(--suave); font-weight: 500; }
  #cuenta { color: var(--tinta); font-weight: 700; }
  .reloj { height: 6px; background: var(--fondo); border-radius: 99px; overflow: hidden; margin: 9px 0 10px; }
  .reloj i { display: block; height: 100%; width: 100%; background: var(--rol); border-radius: 99px; transform-origin: left; }
  .reloj.apuro i { background: var(--alerta); }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .kpis.dos { grid-template-columns: repeat(2, 1fr); }
  .dato { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; padding: 8px 10px 9px; box-shadow: var(--sombra); }
  .dato span { display: block; font-size: 11.5px; font-weight: 500; color: var(--suave); line-height: 1.2; min-height: 28px; }
  .dato b { font-size: 22px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
  .dato b small { font-size: 12px; color: var(--tenue); font-weight: 500; margin-left: 2px; }
  .dato.mal b { color: var(--alerta); }
  .dato.fuerte { border-color: var(--rol); box-shadow: inset 0 0 0 1px var(--rol), var(--sombra); }
  .dato.ancho b { font-size: 26px; }

  .lista { padding: 4px 12px; margin-top: 8px; }
  .lista div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--linea); font-size: 13px; }
  .lista div:last-child { border-bottom: 0; }
  .lista span { color: var(--suave); }
  .lista b { font-weight: 600; text-align: right; }
  svg.barritas { width: 100%; height: 44px; display: block; margin-top: 4px; }

  .pregunta { margin-top: 12px; font-weight: 600; font-size: 15px; }
  .visor { display: flex; align-items: center; gap: 10px; background: var(--tarjeta); border: 1.5px solid var(--rol); border-radius: 12px; padding: 2px 6px 2px 14px; margin-top: 6px; box-shadow: var(--sombra); }
  .visor b { font-size: 32px; font-weight: 700; min-height: 44px; line-height: 44px; }
  .visor span { font-size: 12.5px; color: var(--suave); flex: 1; text-align: right; }
  .visor button { font-size: 20px; padding: 7px 13px; background: var(--fondo); border: 1px solid var(--linea); }
  .teclado { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 7px; }
  .teclado button { padding: 12px 0; font-size: 22px; font-weight: 600; background: var(--tarjeta); border: 1px solid var(--linea); box-shadow: var(--sombra); }
  .teclado button:active, .visor button:active { background: var(--linea); }

  .progreso { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linea); }
  .progreso:last-child { border-bottom: 0; }
  .progreso .icono { grid-row: span 2; width: 34px; height: 34px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
  .progreso .nombre { font-size: 13.5px; font-weight: 600; }
  .progreso .monto { font-size: 13.5px; font-weight: 700; text-align: right; }
  .progreso .pista { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; }
  .progreso .riel { flex: 1; height: 7px; border-radius: 99px; background: #FDECEA; overflow: hidden; }
  .progreso .riel i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #F59E0B, #EF4444); }
  .progreso .pista span { font-size: 11.5px; color: var(--suave); white-space: nowrap; }

  .grande { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
  .codigo { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 34px; font-weight: 700; letter-spacing: .06em; text-align: center; padding: 12px 0 8px; margin: 6px 0; background: var(--acento-suave); color: var(--acento); border-radius: 10px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--suave); margin-top: 6px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 5px; }
  svg.graf { width: 100%; height: auto; display: block; margin-top: 4px; }
  .torres { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-top: 8px; }
  .torres div { border: 1px solid var(--linea); border-radius: 10px; padding: 8px 2px 6px; background: var(--fondo); }
  .torres b { display: block; font-size: 24px; font-weight: 800; }
  .torres span { font-size: 11.5px; color: var(--suave); }
  .torres em { display: block; height: 4px; width: 60%; margin: 0 auto 6px; border-radius: 99px; }
</style>
</head>
<body>
<main id="app"></main>
<script src="motor.js"></script>
<script>
(function () {
  'use strict';
  var M = window.Motor;
  var CLAVE = 'cadena-del-helado-v1';
  var PIEZA_CAJAS = 4;
  var PIEZAS_MAX = 9;

  var ROLES = [
    { nombre: 'Heladería', sub: 'minorista', cliente: 'Tus clientes compraron', proveedor: 'al mayorista', enCamino: 'En camino hacia ti', color: '#4F6BED', trazo: '' },
    { nombre: 'Mayorista', sub: 'abastece a la heladería', cliente: 'La heladería te pidió', proveedor: 'al distribuidor', enCamino: 'En camino hacia ti', color: '#7C3AED', trazo: '7 4' },
    { nombre: 'Distribuidor', sub: 'abastece al mayorista', cliente: 'El mayorista te pidió', proveedor: 'a la fábrica', enCamino: 'En camino hacia ti', color: '#C2410C', trazo: '2 4' },
    { nombre: 'Fábrica', sub: 'produce el helado', cliente: 'El distribuidor te pidió', proveedor: 'a tu línea de producción', enCamino: 'En producción', color: '#0F766E', trazo: '9 3 2 3' }
  ];

  var raiz = document.getElementById('app');
  var app = null;
  var reloj = { id: null, fin: 0, total: 0 };
  var bloqueoPantalla = null;

  // ---------- Estado y guardado ----------
  function configDesdeURL() {
    var q = new URLSearchParams(location.search);
    var c = M.copiar(q.get('modo') === 'original' ? M.CONFIG_ORIGINAL : M.CONFIG_CLASE);
    if (q.has('turno')) {
      var t = parseInt(q.get('turno'), 10);
      if (t >= 0 && t <= 300) { c.segundosTurno = t; c.segundosTurnoInicial = t === 0 ? 0 : Math.max(t, c.segundosTurnoInicial); }
    }
    return c;
  }
  function nuevoApp() {
    return { v: 1, pantalla: 'inicio', cadena: null, config: configDesdeURL(), rondaIdx: 0, estado: null, turno: 0, digitado: '', aviso: '', resultados: [], confirma: '' };
  }
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(app)); } catch (e) { /* sin almacenamiento: la partida sigue en memoria */ }
  }
  function cargar() {
    try {
      var t = localStorage.getItem(CLAVE);
      if (!t) return null;
      var a = JSON.parse(t);
      return a && a.v === 1 ? a : null;
    } catch (e) { return null; }
  }
  function borrarGuardado() { try { localStorage.removeItem(CLAVE); } catch (e) { /* nada */ } }

  function ronda() { return app.config.rondas[app.rondaIdx]; }
  function plazo() { return app.config.retrasoPedido + app.config.retrasoDespacho; }
  function segundosDeTurno() {
    var c = app.config;
    if (!c.segundosTurno) return 0;
    return app.rondaIdx === 0 && app.estado.semana <= c.semanasLentas ? c.segundosTurnoInicial : c.segundosTurno;
  }

  // ---------- Flujo ----------
  function ir(pantalla) { app.pantalla = pantalla; app.confirma = ''; guardar(); pintar(); }

  function comenzarRonda(indice) {
    app.rondaIdx = indice;
    app.estado = M.crearRonda(app.config, indice);
    M.iniciarSemana(app.config, app.estado);
    app.turno = 0; app.digitado = ''; app.aviso = '';
    ir('traspaso');
  }

  function confirmarPedido(cantidad, porTiempo) {
    pararReloj();
    M.registrarPedido(app.estado, app.turno, cantidad);
    app.aviso = porTiempo ? 'Se acabó el tiempo de ' + ROLES[app.turno].nombre.toLowerCase() + ': se pidieron ' + cantidad + ' cajas.' : '';
    app.digitado = '';
    if (app.turno < 3) { app.turno += 1; ir('traspaso'); return; }
    M.cerrarSemana(app.config, app.estado);
    if (app.estado.terminada) {
      app.resultados[app.rondaIdx] = resumenRonda(app.estado);
      app.aviso = '';
      ir(app.rondaIdx < app.config.rondas.length - 1 ? 'finRonda' : 'final');
      return;
    }
    M.iniciarSemana(app.config, app.estado);
    app.turno = 0;
    ir('traspaso');
  }

  function resumenRonda(estado) {
    return {
      costo: M.costoTotal(estado),
      semanas: estado.semana,
      referencia: M.costoReferencia(app.config, estado.ronda),
      demandas: estado.demandas.slice(),
      puestos: estado.puestos.map(function (p) {
        return { costo: p.costo, inventario: p.inventario, deuda: p.deuda, historial: p.historial };
      })
    };
  }

  // ---------- Temporizador ----------
  function pararReloj() { if (reloj.id) { clearInterval(reloj.id); reloj.id = null; } }
  function arrancarReloj() {
    pararReloj();
    var s = segundosDeTurno();
    if (!s) return;
    reloj.total = s * 1000;
    reloj.fin = Date.now() + reloj.total;
    reloj.id = setInterval(tic, 200);
    tic();
  }
  function tic() {
    var queda = reloj.fin - Date.now();
    var barra = document.getElementById('barra');
    var cuenta = document.getElementById('cuenta');
    if (barra) {
      barra.style.transform = 'scaleX(' + Math.max(0, queda / reloj.total) + ')';
      barra.parentNode.className = 'reloj' + (queda < 5000 ? ' apuro' : '');
    }
    if (cuenta) cuenta.textContent = Math.max(0, Math.ceil(queda / 1000)) + ' s';
    if (queda <= 0) {
      var p = app.estado.puestos[app.turno];
      var cantidad = app.digitado === '' ? p.ultimoPedido : parseInt(app.digitado, 10);
      confirmarPedido(cantidad, true);
    }
  }

  // ---------- Pantallas ----------
  function barra() {
    return '<header class="barra"><span class="marca"><i></i>Cadena del Helado</span>' +
      (app.cadena ? '<span class="etiqueta">Cadena ' + app.cadena + '</span>' : '') + '</header>';
  }
  function filtro(etiqueta, valor) { return '<span class="filtro">' + etiqueta + ': <b>' + valor + '</b></span>'; }
  function cabTarjeta(titulo, pildora) {
    return '<div class="tarjeta-cab"><b>' + titulo + '</b>' + (pildora ? '<span class="pildora">' + pildora + '</span>' : '') + '</div>';
  }
  function pInicio() {
    var guardada = cargar();
    var retomar = '';
    if (guardada && guardada.pantalla !== 'inicio' && guardada.pantalla !== 'reglas') {
      var donde = guardada.estado ? guardada.config.rondas[guardada.rondaIdx].nombre + ', semana ' + guardada.estado.semana : '';
      retomar = '<div class="tarjeta">' + cabTarjeta('Partida guardada', 'Cadena ' + guardada.cadena) + '<p class="chico suave">' + (donde || 'Sin comenzar') + '</p>' +
        '<button class="btn" data-a="retomar">Retomar la partida</button></div>';
    }
    var botones = '';
    for (var n = 1; n <= 12; n++) botones += '<button data-a="cadena" data-n="' + n + '"' + (app.cadena === n ? ' class="sel"' : '') + '>' + n + '</button>';
    return barra() + '<h1>Bienvenidos</h1>' +
      '<p class="suave">Cuatro puestos, un celular y una sola decisión por semana: cuántas cajas pedir.</p>' + retomar +
      '<div class="tarjeta">' + cabTarjeta('¿Qué número de cadena son?', 'Lo asigna el profesor') +
      '<div class="cadenas">' + botones + '</div></div>' +
      '<div class="empuja"></div>' +
      '<button class="btn" data-a="aReglas"' + (app.cadena ? '' : ' disabled') + '>Siguiente</button>';
  }

  function pReglas() {
    var c = app.config;
    var dos = c.rondas.length > 1;
    var tiempo = c.segundosTurno
      ? '<li>Cada turno dura <b>' + c.segundosTurno + ' segundos</b> (' + c.segundosTurnoInicial + ' en las primeras ' + c.semanasLentas + ' semanas). Si se acaba el tiempo, se repite el último pedido.</li>'
      : '';
    return barra() + '<h1>Reglas</h1>' +
      '<div class="filtros">' + filtro('Puestos', '4') + filtro('Inventario inicial', '12 cajas') + filtro('Plazo', plazo() + ' semanas') + '</div>' +
      '<div class="tarjeta"><ul class="reglas">' +
      '<li>Son una cadena de 4 puestos: <b>heladería, mayorista, distribuidor y fábrica</b>. Todos parten con 12 cajas.</li>' +
      '<li>Cada semana, cada puesto decide una sola cosa: <b>cuántas cajas pedir</b>.</li>' +
      '<li>Guardar una caja cuesta <b>' + M.pesos(c.costoInventario) + '</b> por semana. Deber una caja cuesta <b>' + M.pesos(c.costoDeuda) + '</b> por semana.</li>' +
      '<li>Lo que pides tarda <b>' + plazo() + ' semanas</b> en llegar, si tu proveedor tiene stock. La fábrica produce en ' + c.retrasoProduccion + '.</li>' +
      '<li><b>No se habla</b> entre puestos y nadie mira el turno de otro. El celular pasa de mano en mano.</li>' +
      tiempo +
      '<li>Gana la cadena con <b>menor costo total</b>' + (dos ? ' entre las dos rondas' : '') + '.</li>' +
      '</ul></div>' +
      '<div class="empuja"></div>' +
      '<button class="btn" data-a="comenzar">Comenzar ' + c.rondas[0].nombre.toLowerCase() + '</button>' +
      '<button class="btn claro" data-a="volverInicio">Volver</button>';
  }

  function pTraspaso() {
    var r = ROLES[app.turno];
    return barra() + '<div class="traspaso">' +
      '<div class="semana">' + ronda().nombre + ' · Semana ' + app.estado.semana + ' de ' + ronda().semanasAnunciadas + '</div>' +
      '<div class="pasa">Pasa el celular a</div>' +
      '<div class="quien">' + r.nombre + '</div><div class="sub">' + r.sub + '</div>' +
      (app.aviso ? '<div class="aviso">' + app.aviso + '</div>' : '') +
      '<button class="btn" data-a="verTurno">Soy ' + r.nombre.toLowerCase() + ': ver mi turno</button>' +
      '</div>';
  }

  function dato(etiqueta, valor, clase) {
    return '<div class="dato' + (clase ? ' ' + clase : '') + '"><span>' + etiqueta + '</span><b>' + valor + '</b></div>';
  }

  function pTurno() {
    var i = app.turno, r = ROLES[i], e = app.estado, p = e.puestos[i], s = e.semanaActual[i], c = app.config;
    var camino = p.enCamino.map(function (x, k) {
      return (k === 0 ? 'próx. semana ' : 'en ' + (k + 1) + ' sem. ') + x;
    }).join(' · ');
    var previos = p.historial.slice(-4).map(function (h) { return h.pedidoHecho; });
    var lineaDemanda = '';
    if (ronda().demandaVisible) {
      lineaDemanda = '<div class="tarjeta" style="padding:10px 12px">' + cabTarjeta('Ventas a clientes', 'Visible para toda la cadena') +
        barritas(e.demandas) + '<div class="chico suave">' + e.demandas.join(' · ') + '</div></div>';
    }
    var hayReloj = segundosDeTurno() > 0;
    return '<div style="height:12px"></div><div class="cabecera"><div class="fila"><b><i></i>' + r.nombre + '</b><span>Semana ' + e.semana + ' de ' + ronda().semanasAnunciadas + (hayReloj ? ' · <span id="cuenta"></span>' : '') + '</span></div>' +
      '<div class="reloj">' + (hayReloj ? '<i id="barra"></i>' : '') + '</div></div>' +
      '<div class="kpis">' +
        dato('Te llegaron', s.recibido) +
        dato(r.cliente, s.pedido, 'fuerte') +
        dato('Despachaste', s.despachado) +
        dato('Inventario', s.inventario) +
        dato('Deuda (cajas que debes)', s.deuda, s.deuda > 0 ? 'mal' : '') +
        dato('Costo de la semana', M.pesos(s.costoSemana)) +
      '</div>' +
      '<div class="tarjeta lista">' +
        '<div><span>' + r.enCamino + '</span><b>' + camino + '</b></div>' +
        '<div><span>Tus pedidos anteriores</span><b>' + (previos.length ? previos.join(' · ') : c.flujoInicial + ' por semana') + '</b></div>' +
        '<div><span>Costo acumulado</span><b>' + M.pesos(p.costo) + '</b></div>' +
      '</div>' +
      lineaDemanda +
      '<div class="pregunta">¿Cuántas cajas pides ' + r.proveedor + '?</div>' +
      '<div class="visor"><b id="visor">' + (app.digitado === '' ? '–' : app.digitado) + '</b><span>último pedido: ' + p.ultimoPedido + '</span><button data-a="borrar" aria-label="Borrar">⌫</button></div>' +
      '<div class="teclado">' +
        [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(function (n) { return '<button data-a="tecla" data-n="' + n + '">' + n + '</button>'; }).join('') +
      '</div>' +
      '<button class="btn rol" id="pedir" data-a="pedir"' + (app.digitado === '' ? ' disabled' : '') + '>' + textoPedir() + '</button>';
  }
  function textoPedir() {
    return app.digitado === '' ? 'Escribe tu pedido' : 'Pedir ' + parseInt(app.digitado, 10) + ' cajas';
  }

  function veces(costo, referencia) {
    return referencia > 0 ? (Math.round(costo / referencia * 10) / 10).toFixed(1).replace('.', ',') : '–';
  }

  function barritas(vals) {
    var W = 300, H = 44, n = Math.max(vals.length, 8), max = 8;
    vals.forEach(function (v) { if (v > max) max = v; });
    var paso = W / n, ancho = Math.max(4, paso * 0.55), g = '';
    vals.forEach(function (v, k) {
      var h = Math.max(2, v / max * (H - 4));
      g += '<rect x="' + (k * paso + (paso - ancho) / 2).toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + ancho.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="#4F6BED"/>';
    });
    return '<svg class="barritas" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + g + '</svg>';
  }

  function grafico(titulo, pildora, series, demandas, minimo) {
    var W = 340, H = 190, izq = 28, der = 6, arr = 10, aba = 22;
    var n = series[0].length;
    var max = 8, min = minimo || 0;
    series.forEach(function (s) { s.forEach(function (v) { if (v > max) max = v; if (v < min) min = v; }); });
    max = Math.ceil(max / 4) * 4; min = Math.floor(min / 4) * 4;
    var paso = (W - izq - der) / n;
    function X(k) { return izq + paso * (k + 0.5); }
    function Y(v) { return arr + (max - v) * (H - arr - aba) / (max - min); }
    var g = '';
    [max, (max + min) / 2, min].forEach(function (v) {
      g += '<line x1="' + izq + '" x2="' + (W - der) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#EEF0F3"/>' +
        '<text x="' + (izq - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="10.5" fill="#9CA3AF">' + Math.round(v) + '</text>';
    });
    if (min < 0) g += '<line x1="' + izq + '" x2="' + (W - der) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="#9CA3AF"/>';
    if (demandas) {
      var ancho = Math.max(3, paso * 0.6);
      demandas.forEach(function (v, k) {
        g += '<rect x="' + (X(k) - ancho / 2).toFixed(1) + '" y="' + Y(v).toFixed(1) + '" width="' + ancho.toFixed(1) + '" height="' + (Y(min) - Y(v)).toFixed(1) + '" rx="2" fill="#4F6BED" fill-opacity=".16"/>';
      });
    }
    [1, Math.ceil(n / 2), n].forEach(function (sem) {
      var ancla = sem === 1 ? 'start' : (sem === n ? 'end' : 'middle');
      var xx = sem === 1 ? izq : (sem === n ? W - der : X(sem - 1));
      g += '<text x="' + xx + '" y="' + (H - 6) + '" text-anchor="' + ancla + '" font-size="10.5" fill="#9CA3AF">sem ' + sem + '</text>';
    });
    function linea(vals) { return vals.map(function (v, k) { return (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(''); }
    series.forEach(function (s, i) {
      g += '<path d="' + linea(s) + '" fill="none" stroke="' + ROLES[i].color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"' + (ROLES[i].trazo ? ' stroke-dasharray="' + ROLES[i].trazo + '"' : '') + '/>';
    });
    var ley = ROLES.map(function (r) {
      return '<span><svg width="24" height="8"><line x1="0" x2="24" y1="4" y2="4" stroke="' + r.color + '" stroke-width="2.2"' + (r.trazo ? ' stroke-dasharray="' + r.trazo + '"' : '') + '/></svg>' + r.nombre + '</span>';
    }).join('');
    if (demandas) ley += '<span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="#4F6BED" fill-opacity=".25"/></svg>Clientes</span>';
    return '<div class="tarjeta">' + cabTarjeta(titulo, pildora) +
      '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + titulo + '">' + g + '</svg>' +
      '<div class="leyenda">' + ley + '</div></div>';
  }

  function bloqueRonda(indice) {
    var res = app.resultados[indice], cfg = app.config.rondas[indice];
    var mayor = Math.max.apply(null, res.puestos.map(function (p) { return p.costo; })) || 1;
    var filas = res.puestos.map(function (p, i) {
      var maximo = Math.max.apply(null, p.historial.map(function (h) { return h.pedidoHecho; }));
      var parte = res.costo > 0 ? Math.round(p.costo / res.costo * 100) : 0;
      return '<div class="progreso"><div class="icono" style="background:' + ROLES[i].color + '">' + ROLES[i].nombre.charAt(0) + '</div>' +
        '<div class="nombre">' + ROLES[i].nombre + '</div><div class="monto">' + M.pesos(p.costo) + '</div>' +
        '<div class="pista"><div class="riel"><i style="width:' + Math.round(p.costo / mayor * 100) + '%"></i></div><span>' + parte + '% · pedido máx. ' + maximo + '</span></div></div>';
    }).join('');
    var pedidos = res.puestos.map(function (p) { return p.historial.map(function (h) { return h.pedidoHecho; }); });
    var neto = res.puestos.map(function (p) { return p.historial.map(function (h) { return h.inventario - h.deuda; }); });
    return '<h2>' + cfg.nombre + '</h2>' +
      '<div class="kpis">' +
        '<div class="dato"><span>Costo de la cadena</span><b>' + M.pesos(res.costo) + '</b></div>' +
        '<div class="dato"><span>Veces la referencia</span><b>' + veces(res.costo, res.referencia) + '<small>×</small></b></div>' +
        '<div class="dato"><span>Semanas jugadas</span><b>' + res.semanas + '<small>/' + cfg.semanasAnunciadas + '</small></b></div>' +
      '</div>' +
      '<p class="chico suave">La referencia es una cadena que siempre pide lo mismo que le piden: habría gastado ' + M.pesos(res.referencia) + '.</p>' +
      '<div class="tarjeta">' + cabTarjeta('Costo por puesto', cfg.nombre) + filas + '</div>' +
      grafico('Pedidos por semana', cfg.nombre, pedidos, res.demandas) +
      '<p class="chico suave">Las barras celestes son lo que compraron los clientes: ' + cfg.demandaBase + ' cajas por semana y ' + cfg.demandaNueva + ' desde la semana ' + cfg.semanaSalto + '. Nunca cambió más que eso.</p>' +
      grafico('Inventario menos deuda', cfg.nombre, neto, null, -4);
  }

  function pFinRonda() {
    var res = app.resultados[app.rondaIdx];
    var torres = res.puestos.map(function (p, i) {
      var piezas = Math.min(PIEZAS_MAX, Math.round(p.inventario / PIEZA_CAJAS));
      return '<div><em style="background:' + ROLES[i].color + '"></em><span>' + ROLES[i].nombre + '</span><b>' + piezas + '</b><span>' + p.inventario + ' cajas</span></div>';
    }).join('');
    var sig = app.config.rondas[app.rondaIdx + 1];
    return barra() + '<h1>Fin de la ' + ronda().nombre.toLowerCase() + '</h1><p class="suave">Ya pueden conversar.</p>' +
      '<div class="tarjeta">' + cabTarjeta('Torres LEGO', 'Pausa') + '<p class="chico suave">Cada puesto arma una torre con su inventario final: 1 pieza por cada ' + PIEZA_CAJAS + ' cajas, máximo ' + PIEZAS_MAX + '.</p>' +
      '<div class="torres">' + torres + '</div></div>' +
      bloqueRonda(app.rondaIdx) +
      '<div class="tarjeta">' + cabTarjeta(sig.nombre, 'Siguiente') + '<p class="chico">Ahora toda la cadena ve las ventas a clientes y pueden conversar antes de cada pedido. Dura menos semanas. Esperen la señal del profesor.</p></div>' +
      '<button class="btn" data-a="siguienteRonda">' + (app.confirma === 'ronda' ? 'Toca otra vez para comenzar' : 'Comenzar ' + sig.nombre.toLowerCase()) + '</button>';
  }

  function pFinal() {
    var rs = app.resultados;
    var total = rs.reduce(function (a, r) { return a + r.costo; }, 0);
    var codigo = M.codificar({ cadena: app.cadena, costo1: rs[0].costo, costo2: rs[1] ? rs[1].costo : 0 });
    var compara = '';
    if (rs.length > 1) {
      compara = '<p class="chico">Frente a la referencia de cada ronda: <b>' + veces(rs[0].costo, rs[0].referencia) + ' veces</b> a ciegas y <b>' + veces(rs[1].costo, rs[1].referencia) + ' veces</b> con información compartida.</p>';
    }
    var bloques = '';
    for (var i = 0; i < rs.length; i++) bloques += bloqueRonda(i);
    return barra() + '<h1>Resultado final</h1>' +
      '<div class="tarjeta">' + cabTarjeta('Código para el profesor', 'Ranking') + '<div class="codigo" id="codigo">' + codigo + '</div>' +
      '<p class="chico suave" style="text-align:center">Díctenlo o muéstrenlo cuando lo pidan.</p></div>' +
      '<div class="tarjeta">' + cabTarjeta('Costo total de la cadena', rs.length > 1 ? 'Ambas rondas' : '') + '<div class="grande">' + M.pesos(total) + '</div>' + compara + '</div>' +
      bloques +
      '<button class="btn claro" data-a="csv">Descargar los datos (CSV)</button>' +
      '<button class="btn claro" data-a="nueva">' + (app.confirma === 'nueva' ? 'Toca otra vez: se borra esta partida' : 'Nueva partida') + '</button>';
  }

  function csv() {
    var filas = ['cadena,ronda,semana,puesto,recibido,pedido_recibido,despachado,inventario,deuda,pedido_hecho,costo_semana'];
    app.resultados.forEach(function (res, r) {
      res.puestos.forEach(function (p, i) {
        p.historial.forEach(function (h) {
          filas.push([app.cadena, r + 1, h.semana, ROLES[i].nombre, h.recibido, h.pedido, h.despachado, h.inventario, h.deuda, h.pedidoHecho, h.costoSemana].join(','));
        });
      });
    });
    var blob = new Blob(['﻿' + filas.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cadena-' + app.cadena + '-helado.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  var PANTALLAS = { inicio: pInicio, reglas: pReglas, traspaso: pTraspaso, turno: pTurno, finRonda: pFinRonda, final: pFinal };

  function pintar() {
    pararReloj();
    var rol = app.pantalla === 'traspaso' || app.pantalla === 'turno' ? ROLES[app.turno].color : '#111827';
    document.documentElement.style.setProperty('--rol', rol);
    raiz.innerHTML = PANTALLAS[app.pantalla]();
    raiz.setAttribute('data-pantalla', app.pantalla);
    window.scrollTo(0, 0);
    if (app.pantalla === 'turno') arrancarReloj();
  }

  function refrescarVisor() {
    var v = document.getElementById('visor'), b = document.getElementById('pedir');
    if (v) v.textContent = app.digitado === '' ? '–' : app.digitado;
    if (b) { b.disabled = app.digitado === ''; b.textContent = textoPedir(); }
  }

  function mantenerPantalla() {
    try {
      if (navigator.wakeLock && !bloqueoPantalla) {
        navigator.wakeLock.request('screen').then(function (l) {
          bloqueoPantalla = l;
          l.addEventListener('release', function () { bloqueoPantalla = null; });
        }).catch(function () { /* no disponible */ });
      }
    } catch (e) { /* no disponible */ }
  }

  // ---------- Eventos ----------
  raiz.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]');
    if (!b || b.disabled) return;
    var a = b.getAttribute('data-a');
    mantenerPantalla();
    if (a === 'cadena') { app.cadena = parseInt(b.getAttribute('data-n'), 10); pintar(); }
    else if (a === 'aReglas') ir('reglas');
    else if (a === 'volverInicio') ir('inicio');
    else if (a === 'retomar') { var g = cargar(); if (g) { app = g; app.digitado = ''; pintar(); } }
    else if (a === 'comenzar') comenzarRonda(0);
    else if (a === 'verTurno') { app.digitado = ''; ir('turno'); }
    else if (a === 'tecla') {
      var n = b.getAttribute('data-n');
      if (app.digitado.length < 3) app.digitado = app.digitado === '0' ? n : app.digitado + n;
      refrescarVisor();
    }
    else if (a === 'borrar') { app.digitado = app.digitado.slice(0, -1); refrescarVisor(); }
    else if (a === 'pedir') { if (app.digitado !== '') confirmarPedido(parseInt(app.digitado, 10), false); }
    else if (a === 'siguienteRonda') {
      if (app.confirma === 'ronda') comenzarRonda(app.rondaIdx + 1);
      else { app.confirma = 'ronda'; pintar(); }
    }
    else if (a === 'csv') csv();
    else if (a === 'nueva') {
      if (app.confirma === 'nueva') { borrarGuardado(); app = nuevoApp(); pintar(); }
      else { app.confirma = 'nueva'; pintar(); }
    }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) mantenerPantalla(); });

  app = nuevoApp();
  pintar();
})();
</script>

</html>
